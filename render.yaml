services:
  - type: web
    name: nexvora-assessment-platform
    runtime: node
    region: singapore
    plan: free
    buildCommand: npm install --prefix server && npm install --prefix client && npm run build --prefix client
    startCommand: npm start --prefix server
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /tmp/data
      - key: JWT_SECRET
        generateValue: true
